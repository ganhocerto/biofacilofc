<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241242"/>
      <stop offset="50%" stop-color="#140a28"/>
      <stop offset="100%" stop-color="#080314"/>
    </linearGradient>
    
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="25%" stop-color="#c084fc"/>
      <stop offset="60%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f3e8ff"/>
      <stop offset="75%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <rect x="6" y="6" width="52" height="52" rx="15" fill="#a855f7" opacity="0.3" filter="url(#neonGlow)"/>

  <!-- 3D Border -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#borderGrad)"/>

  <!-- Inner Surface -->
  <rect x="6.5" y="6.5" width="51" height="51" rx="13.5" fill="url(#bgGrad)"/>

  <!-- Glossy Reflection Sheen -->
  <path d="M 7 19 C 7 12 12 7 20 7 L 44 7 C 52 7 57 12 57 19 C 45 28 19 31 7 19 Z" fill="#ffffff" opacity="0.14"/>

  <!-- 3D Monogram "BF" -->
  <text x="32" y="43" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="27" font-weight="900" fill="url(#letterGrad)" text-anchor="middle" letter-spacing="-1.5">BF</text>
</svg>
